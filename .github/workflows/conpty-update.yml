name: ConPTY update check

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check for a newer Microsoft.Windows.Console.ConPTY
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compare pinned version with NuGet
        run: ./scripts/update_conpty.py --check
