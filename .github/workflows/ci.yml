name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  linux:
    name: GNU/Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout coffer
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake libtool make pkg-config

      - name: Build
        run: |
          ./autogen.sh
          mkdir build && cd build
          ../configure
          make -j"$(nproc)"
          # Compile terminfo so PTY tests can resolve coffer-vty-256color
          tic -x -o "${PWD}/terminfo" ../data/coffer.ti

      - name: Run tests
        run: |
          export TERMINFO_DIRS="${PWD}/terminfo"
          make -C build check

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs
          path: build/tests/*.log
          retention-days: 7

  macos:
    name: macOS
    runs-on: macos-latest

    steps:
      - name: Checkout coffer
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: brew install autoconf automake libtool pkg-config

      - name: Build
        run: |
          ./autogen.sh
          mkdir build && cd build
          ../configure
          make -j"$(sysctl -n hw.ncpu)"
          # Compile terminfo so PTY tests can resolve coffer-vty-256color
          tic -x -o "${PWD}/terminfo" ../data/coffer.ti

      - name: Run tests
        run: |
          export TERMINFO_DIRS="${PWD}/terminfo"
          make -C build check

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: macos-test-logs
          path: build/tests/*.log
          retention-days: 7

  windows:
    name: Windows (MSYS2 UCRT64)
    runs-on: windows-latest

    steps:
      - name: Checkout coffer
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-autotools
            mingw-w64-ucrt-x86_64-pkgconf
            unzip
            git

      - name: Cache ConPTY bundle
        uses: actions/cache@v4
        with:
          path: data/conpty
          key: conpty-${{ hashFiles('data/conpty/conpty.lock') }}

      - name: Build
        shell: msys2 {0}
        run: |
          ./scripts/build-ucrt64.sh --no-check
          # Compile terminfo so PTY tests can resolve coffer-vty-256color
          tic -x -o "${PWD}/build/terminfo" data/coffer.ti

      - name: Verify bundled ConPTY
        shell: msys2 {0}
        run: |
          ./build/src/coffer.exe --conpty-info | tee conpty-info.txt
          grep -q '^backend=bundled$' conpty-info.txt
          grep -q '^passthrough=yes$' conpty-info.txt
          grep -q '^version=1\.' conpty-info.txt

      - name: Verify ConPTY bundle architecture
        shell: msys2 {0}
        run: |
          if command -v python3 >/dev/null 2>&1; then
            python3 scripts/verify_conpty_bundle.py
          else
            echo "python3 unavailable in MSYS2; release job verifies all bundles"
          fi

      - name: Run tests
        shell: msys2 {0}
        run: |
          export TERMINFO_DIRS="${PWD}/build/terminfo"
          make -C build check

      - name: Report ConPTY palette forwarding
        shell: msys2 {0}
        run: |
          grep -E 'palette probe|raw \(' build/tests/test_cfr_pty.log || true

      - name: Run tests with system conhost fallback
        shell: msys2 {0}
        run: |
          export TERMINFO_DIRS="${PWD}/build/terminfo"
          export COFFER_CONPTY=system
          ./build/tests/test_cfr_pty.exe -v

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-test-logs
          path: build/tests/*.log
          retention-days: 7

  windows-arm64:
    name: Windows arm64 (MSYS2 CLANGARM64)
    runs-on: windows-11-arm

    steps:
      - name: Checkout coffer
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          install: >-
            mingw-w64-clang-aarch64-clang
            mingw-w64-clang-aarch64-autotools
            mingw-w64-clang-aarch64-pkgconf
            unzip
            git

      - name: Cache ConPTY bundle
        uses: actions/cache@v4
        with:
          path: data/conpty
          key: conpty-${{ hashFiles('data/conpty/conpty.lock') }}

      - name: Build
        shell: msys2 {0}
        run: |
          export COFFER_MSYS2_ENV=CLANGARM64
          ./scripts/build-ucrt64.sh --no-check
          # Compile terminfo so PTY tests can resolve coffer-vty-256color
          tic -x -o "${PWD}/build/terminfo" data/coffer.ti

      - name: Verify bundled ConPTY
        shell: msys2 {0}
        run: |
          ./build/src/coffer.exe --conpty-info | tee conpty-info.txt
          grep -q '^backend=bundled$' conpty-info.txt
          grep -q '^passthrough=yes$' conpty-info.txt
          grep -q '^version=1\.' conpty-info.txt

      - name: Verify ConPTY bundle architecture
        shell: msys2 {0}
        run: |
          if command -v python3 >/dev/null 2>&1; then
            python3 scripts/verify_conpty_bundle.py
          else
            echo "python3 unavailable in CLANGARM64; release job verifies all bundles"
          fi

      - name: Run tests
        shell: msys2 {0}
        run: |
          export TERMINFO_DIRS="${PWD}/build/terminfo"
          make -C build check

      - name: Report ConPTY palette forwarding
        shell: msys2 {0}
        run: |
          grep -E 'palette probe|raw \(' build/tests/test_cfr_pty.log || true

      - name: Run tests with system conhost fallback
        shell: msys2 {0}
        run: |
          export TERMINFO_DIRS="${PWD}/build/terminfo"
          export COFFER_CONPTY=system
          ./build/tests/test_cfr_pty.exe -v

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-arm64-test-logs
          path: build/tests/*.log
          retention-days: 7

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout coffer
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake libtool make pkg-config unzip

      - name: Cache ConPTY bundle
        uses: actions/cache@v4
        with:
          path: data/conpty
          key: conpty-${{ hashFiles('data/conpty/conpty.lock') }}

      - name: Build dist tarball
        run: |
          ./autogen.sh
          mkdir build && cd build
          ../configure
          make dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: build/coffer-*.tar.gz
          generate_release_notes: false
          fail_on_unmatched_files: true
