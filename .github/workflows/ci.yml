name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  linux:
    name: GNU/Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout coffer
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake libtool make pkg-config

      - name: Build
        run: |
          ./autogen.sh
          mkdir build && cd build
          ../configure
          make -j"$(nproc)"
          # Compile terminfo so PTY tests can resolve coffer-vty-256color
          tic -x -o "${PWD}/terminfo" ../data/coffer.ti

      - name: Run tests
        run: |
          export TERMINFO_DIRS="${PWD}/terminfo"
          make -C build check

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs
          path: build/tests/*.log
          retention-days: 7

  macos:
    name: macOS
    runs-on: macos-latest

    steps:
      - name: Checkout coffer
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: brew install autoconf automake libtool pkg-config

      - name: Build
        run: |
          ./autogen.sh
          mkdir build && cd build
          ../configure
          make -j"$(sysctl -n hw.ncpu)"
          # Compile terminfo so PTY tests can resolve coffer-vty-256color
          tic -x -o "${PWD}/terminfo" ../data/coffer.ti

      - name: Run tests
        run: |
          export TERMINFO_DIRS="${PWD}/terminfo"
          make -C build check

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: macos-test-logs
          path: build/tests/*.log
          retention-days: 7

  windows:
    name: Windows (MSYS2 UCRT64)
    runs-on: windows-latest

    steps:
      - name: Checkout coffer
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-autotools
            mingw-w64-ucrt-x86_64-pkgconf
            git

      - name: Build
        shell: msys2 {0}
        run: |
          ./scripts/build-ucrt64.sh --no-check
          # Compile terminfo so PTY tests can resolve coffer-vty-256color
          tic -x -o "${PWD}/build/terminfo" data/coffer.ti

      - name: Run tests
        shell: msys2 {0}
        run: |
          export TERMINFO_DIRS="${PWD}/build/terminfo"
          make -C build check

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-test-logs
          path: build/tests/*.log
          retention-days: 7

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout coffer
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake libtool make pkg-config

      - name: Build dist tarball
        run: |
          ./autogen.sh
          mkdir build && cd build
          ../configure
          make dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: build/coffer-*.tar.gz
          generate_release_notes: false
          fail_on_unmatched_files: true
